name = "cdn-worker-v2-prod"
main = "cdn.ts"
compatibility_date = "2024-01-01"

# 自定义域名路由配置
routes = [
  { pattern = "image.hiaplha.xyz/*", zone_name = "hiaplha.xyz" }
]

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "next-lambda-image-r2"

[vars]
ALLOWED_ORIGINS = "*"
IMAGES_BUCKET_ID = "next-lambda-image-r2"
# 防盗链：允许 nodeseek.com 和自己的 lambdax.me 域名引用图片
ALLOWED_REFERERS = "nodeseek.com,lambdax.me,localhost,127.0.0.1"
